[package]
name        = "bot-db"
description = "FreeSynergy Bot Manager — database object and domain entities"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
authors     = ["FreeSynergy.Net"]

[features]
default = ["sqlite"]
sqlite  = ["dep:fs-db-engine-sqlite"]

[dependencies]
fs-db               = { path = "../../fs-db" }
fs-db-engine-sqlite = { path = "../../fs-db-engine-sqlite", optional = true }
fs-error            = { path = "../../fs-libs/fs-error" }
anyhow              = "1"
chrono              = { version = "0.4", features = ["serde"] }
serde_json          = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
